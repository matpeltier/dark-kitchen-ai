name: Bug report
description: Report a reproducible problem in Dark Kitchen AI
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not include API keys, GitHub tokens, private issue bodies, or private repository data.
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `dark-kitchen-ai --version` or the commit SHA.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Node version, GitHub CLI version, Orca version, and codex-workflow version.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Commands, expected behavior, actual behavior, and redacted logs.
    validations:
      required: true
